[terminal]
vt = 1

[default_session]
command = "/usr/bin/env WLR_RENDERER=pixman WLR_NO_HARDWARE_CURSORS=1 GTK_THEME=Adwaita:dark LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 LANGUAGE=en /usr/bin/dbus-run-session /usr/bin/cage -s -mlast -d -- /usr/bin/gtkgreet-controls -s /etc/greetd/gtkgreet.css -c /usr/local/bin/greetd-session/Hyprland"
user = "greeter"
