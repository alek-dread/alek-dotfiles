[package]
name = "waybar-workspace"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Event-driven Hyprland workspace state for Waybar"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
