# Graphite Rhythm: 7u rows; 4u / 3u content padding; 2u prompt gap.
[main]
dpi-aware = no
font = Iosevka Aile:size=11,IosevkaTerm Nerd Font Propo:size=11
terminal = desktop-terminal -e
launch-prefix = uwsm app --
lines = 8
width = 48
horizontal-pad = 16
vertical-pad = 12
inner-pad = 8
icons-enabled = no
# Fuzzel measures line-height in points: 21pt = 28px at 96 DPI.
line-height = 21
prompt = "> "

[colors]
background = 282828ff
text = d4c7adff
prompt = b3919eff
placeholder = a89984ff
input = d4c7adff
counter = a89984ff
match = c1a16bff
selection = c1a16bff
selection-text = 282828ff
selection-match = 282828ff
border = c1a16bff

[border]
width = 2
radius = 0
selection-radius = 0
