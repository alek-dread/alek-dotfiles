# Arthur: 7u rows; 4u / 3u content padding; 2u prompt gap.
[main]
dpi-aware = no
font = Iosevka Aile:size=11,IosevkaTerm Nerd Font Propo:size=11
terminal = desktop-terminal -e
launch-prefix = uwsm app --
lines = 8
width = 48
horizontal-pad = 16
vertical-pad = 12
inner-pad = 8
icons-enabled = no
# Fuzzel measures line-height in points: 21pt = 28px at 96 DPI.
line-height = 21
prompt = "Run: "

[colors]
background = 1c1c1cff
text = ddeeddff
prompt = deb887ff
placeholder = bbaa99ff
input = ddeeddff
counter = bbaa99ff
match = bbaa99ff
selection = bbaa99ff
selection-text = 1c1c1cff
selection-match = 1c1c1cff
border = bbaa99ff

[border]
width = 2
radius = 0
selection-radius = 0
