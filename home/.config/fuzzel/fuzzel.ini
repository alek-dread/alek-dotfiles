[main]
font = IosevkaTerm Nerd Font Mono:size=14
terminal = alacritty -e
launch-prefix = uwsm app --
lines = 8
width = 48
horizontal-pad = 16
vertical-pad = 12
inner-pad = 8
icons-enabled = no
prompt = "> "

[colors]
background = 282828ff
text = d4c7adff
match = 8caaa0ff
selection = 504945ff
selection-text = d4c7adff
selection-match = 8caaa0ff
border = 8caaa0ff

[border]
width = 2
radius = 0
