# Arthur: 80u field width, 12u height, 2px focus contour.
# Shared geometry: ~/.config/desktop-design/DESIGN.md
animations {
    enabled = false
}

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(1c1c1c)
}

input-field {
    monitor =
    size = 320, 48
    position = 0, 0
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 0
    outer_color = rgb(4d4d4d)
    inner_color = rgb(3d352a)
    font_color = rgb(ddeedd)
    check_color = rgb(bbaa99)
    fail_color = rgb(cd5c5c)
    capslock_color = rgb(bbaa99)
    font_family = Iosevka Aile
    placeholder_text = Password
    fail_text = Authentication failed
}

# Time remains legible above the authentication field without animations.
label {
    monitor =
    text = $TIME
    color = rgb(ddeedd)
    font_size = 40
    font_family = Iosevka Aile
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = rgb(deb887)
    font_size = 11
    font_family = Iosevka Aile
    position = 0, -64
    halign = center
    valign = center
}
