# Graphite Rhythm: 80u field width, 12u height, 2px focus contour.
# Shared geometry: ~/.config/desktop-design/DESIGN.md
animations {
    enabled = false
}

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(282828)
}

input-field {
    monitor =
    size = 320, 48
    position = 0, 0
    halign = center
    valign = center
    outline_thickness = 2
    rounding = 0
    outer_color = rgb(504945)
    inner_color = rgb(323230)
    font_color = rgb(d4c7ad)
    check_color = rgb(c1a16b)
    fail_color = rgb(d39a8b)
    capslock_color = rgb(c1a16b)
    font_family = Iosevka Aile
    placeholder_text = Password
    fail_text = Authentication failed
}

# Time remains legible above the authentication field without animations.
label {
    monitor =
    text = $TIME
    color = rgb(d4c7ad)
    font_size = 40
    font_family = Iosevka Aile
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[EN,RU]
    color = rgb(b3919e)
    font_size = 11
    font_family = Iosevka Aile
    position = 0, -64
    halign = center
    valign = center
}
