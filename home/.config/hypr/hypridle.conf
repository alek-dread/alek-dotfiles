general {
    lock_cmd = systemctl --user start --no-block desktop-lock.service
    on_lock_cmd = /home/alek/.local/bin/desktop-lock-state locked
    on_unlock_cmd = /home/alek/.local/bin/desktop-lock-state unlocked
    # Suspend is disabled on this workstation; locking and DPMS are independent.
    inhibit_sleep = 0
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
