# Arthur: 2u minimum content padding; reading font is intentionally larger.
[window]
padding.x = 8
padding.y = 8
dynamic_padding = true
decorations = "None"
opacity = 1.0

[font]
normal.family = "IosevkaTerm Nerd Font Mono"
normal.style = "Regular"
bold.family = "IosevkaTerm Nerd Font Mono"
bold.style = "Bold"
italic.family = "IosevkaTerm Nerd Font Mono"
italic.style = "Italic"
bold_italic.family = "IosevkaTerm Nerd Font Mono"
bold_italic.style = "Bold Italic"
size = 13.0
builtin_box_drawing = false

[scrolling]
history = 10000

[cursor]
style.shape = "Block"
style.blinking = "Off"

# Colors (Arthur)

[colors.bright]
black = '#554444'
blue = '#87ceeb'
cyan = '#b0c4de'
green = '#88aa22'
magenta = '#996600'
red = '#cc5533'
white = '#ddccbb'
yellow = '#ffa75d'

[colors.cursor]
cursor = '#e2bbef'
text = '#000000'

[colors.normal]
black = '#3d352a'
blue = '#6495ed'
cyan = '#b0c4de'
green = '#86af80'
magenta = '#deb887'
red = '#cd5c5c'
white = '#bbaa99'
yellow = '#e8ae5b'

[colors.primary]
